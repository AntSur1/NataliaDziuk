<style>
  :root{
    --bg-top:#1b1620;
    --bg-bottom:#2a1f2e;
    --card-bg:rgba(255,255,255,0.06);
    --card-border:rgba(255,255,255,0.12);
    --text:#f4eef2;
    --muted:#c7b9c3;
    --accent:#7bdcff;
    --accent-2:#f4b065;
  }
  *{box-sizing:border-box;}
  html,body{margin:0;padding:0;}
  body{
    min-height:100vh;
    font-family: 'Segoe UI', Roboto, Helvetica, Arial, sans-serif;
    background: radial-gradient(circle at 50% 0%, var(--bg-bottom), var(--bg-top) 70%);
    color: var(--text);
    display:flex;
    justify-content:center;
    padding: 48px 20px 60px;
  }
  .card{
    width:100%;
    max-width:420px;
    text-align:center;
  }
  .avatar{
    width:204px;
    /* height:104px; */
    /* border-radius:50%; */
    object-fit:cover;
    border:3px solid var(--accent);
    /* box-shadow:0 0 0 6px rgba(224,143,174,0.15); */
    margin-bottom:18px;
    background:#3a2c3f;
  }
  h1{
    font-size:1.5rem;
    margin:0 0 4px;
    letter-spacing:0.5px;
  }
  .tagline{
    color:var(--muted);
    font-size:0.95rem;
    margin:0 0 32px;
  }
  .links{
    list-style:none;
    margin:0;
    padding:0;
    display:flex;
    flex-direction:column;
    gap:14px;
  }
  .links a{
    display:flex;
    align-items:center;
    gap:14px;
    padding:14px 20px;
    border-radius:14px;
    background:var(--card-bg);
    border:1px solid var(--card-border);
    color:var(--text);
    text-decoration:none;
    font-size:1rem;
    font-weight:500;
    transition: transform 0.15s ease, background 0.15s ease, border-color 0.15s ease;
    backdrop-filter: blur(6px);
  }
  .links a:hover, .links a:focus-visible{
    transform: translateY(-2px);
    background:rgba(255,255,255,0.12);
    border-color:var(--accent);
  }
  .links a i{
    width:22px;
    text-align:center;
    font-size:1.15rem;
    color:var(--accent-2);
    flex-shrink:0;
  }
  .links a span{
    flex:1;
    text-align:left;
  }
  .links a .arrow{
    color:var(--muted);
    font-size:0.85rem;
  }
  footer{
    margin-top:40px;
    font-size:0.78rem;
    color:var(--muted);
  }
  footer a{
    color:var(--muted);
  }
</style>
</head>
